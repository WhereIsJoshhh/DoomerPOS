{% extends 'base.html' %}
{% block content %}
<h2>Productos y menú</h2>
<table><thead><tr><th>ID</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Estado</th></tr></thead>
<tbody>{% for p in productos %}<tr><td>{{ p.id_producto }}</td><td>{{ p.nombre }}</td><td>{{ p.categoria.nombre }}</td><td>L {{ p.precio }}</td><td>{{ p.estado }}</td></tr>{% endfor %}</tbody></table>
{% endblock %}
